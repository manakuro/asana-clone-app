name: asana-clone-app
services:
  mysql:
    container_name: mysql8.4
    image: mysql:8.4
    volumes:
      - mysql-data-8.4:/var/lib/mysql
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_as_ci
    environment:
      TZ:  "/usr/share/zoneinfo/Asia/Tokyo"
      MYSQL_ROOT_PASSWORD: root

    ports:
      - '3308:3306'
  redis:
    container_name: redis5.0.7
    image: redis:5.0.7
    volumes:
      - redis-data:/data
    ports:
      - '6379:6379'
volumes:
  mysql-data-8.4:
    driver: local
  redis-data:
    driver: local
