version: "2"

formatters:
  enable:
    - goimports
  exclusions:
    generated: lax

linters:
  default: none
  enable:
    - revive
    - govet
    - errcheck
    - ineffassign
    - unconvert
    - misspell
    - prealloc
    - gosec

  settings:
    govet:
      enable:
        - shadow

    errcheck:
      exclude-functions:
        - fmt.*

    revive:
      # Use recommended configuration
      # @see https://github.com/mgechev/revive#recommended-configuration
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
#        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id

  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
        source: '\.Close\(\)'
      - path: 'pkg/adapter/resolver/.*\.resolvers\.go'
        linters:
          - revive
        text: 'var-naming'
