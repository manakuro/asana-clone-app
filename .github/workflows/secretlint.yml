name: Secretlint
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secretlint:
    name: Secretlint
    runs-on: ubuntu-latest
    env:
      SAFE_CHAIN_LOGGING: silent
    steps:
      - uses: actions/checkout@v4
      - name: Setup monorepo
        uses: ./.github/actions/setup
      - name: Run secretlint
        run: pnpm secretlint
