name: 【react-native】EAS Build (Preview)

on:
  push:
    branches: [main]
    paths:
      - "apps/react-native/**"
      - ".github/workflows/react-native-eas-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SAFE_CHAIN_LOGGING: silent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Allow dtrace-provider build script
        run: pnpm config set --global --json allowBuilds '{"dtrace-provider":true}'

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install safe-chain
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node_modules_cache_id
        with:
          path: "**/node_modules"
          key: v2-pnpm-${{ hashFiles(format('{0}{1}', github.workspace, '/pnpm-lock.yaml')) }}
          restore-keys: |
            v2-pnpm-

      - name: Run install
        if: steps.node_modules_cache_id.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
        env:
          SAFE_CHAIN_NPM_MINIMUM_PACKAGE_AGE_EXCLUSIONS: ""

      - name: Build on EAS (preview)
        working-directory: apps/react-native
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --json > build-output.json
          echo "BUILD_URL=$(jq -r '.[0].artifacts.buildUrl' build-output.json)" >> $GITHUB_ENV

      - name: Summary
        run: |
          echo "### 📱 Preview Build" >> $GITHUB_STEP_SUMMARY
          echo "[インストールリンク]($BUILD_URL)" >> $GITHUB_STEP_SUMMARY
